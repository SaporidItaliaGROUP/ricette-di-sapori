<!doctype html><html><head><meta charset="utf-8"><title>Risotto ai funghi - vecchio sito</title></head><body>
<div itemscope itemtype="http://schema.org/Recipe">
 <h1 itemprop="name">Risotto ai funghi porcini</h1>
 <img itemprop="image" src="/immagini/risotto.jpg" alt="">
 <p>Per <span itemprop="recipeYield">4 persone</span> – pronto in <time itemprop="totalTime" datetime="PT35M">35 minuti</time></p>
 <ul>
  <li itemprop="recipeIngredient">320 g di riso <b>Carnaroli</b></li>
  <li itemprop="recipeIngredient">300 g di funghi porcini</li>
  <li itemprop="ingredients">1 l di brodo vegetale</li>
  <li itemprop="recipeIngredient"><span>40 g</span> <span>di burro</span></li>
 </ul>
 <div itemprop="recipeInstructions"><div class="passo"><p>Pulite i funghi e tagliateli a fette.</p></div><div class="passo"><p>Tostate il riso e sfumate.</p></div><p>Portate a cottura con il brodo e mantecate.</p></div>
